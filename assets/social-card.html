<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Social card · State of the Prompt</title>
<!--
  The source of assets/social-card.png, the image shown when a page from this site
  is shared on social media, in messages or in email previews (1200 x 630 pixels).
  Rebuild after changing this file or the logo, with Edge or Chrome run headless:
    --headless --disable-gpu --hide-scrollbars --allow-file-access-from-files
    --virtual-time-budget=10000 --window-size=1200,630
    --screenshot=<site>/assets/social-card.png <site>/assets/social-card.html
  The dial is drawn from data/hours.json and data/site.json, as on the home page.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Public+Sans:wght@400;500;600&display=block">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #0f1724; color: #e8ecf2; font-family: "Public Sans", Arial, sans-serif; position: relative; }
.text { position: absolute; left: 72px; top: 64px; width: 610px; }
.brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 26px; color: #fff; }
.brand img { width: 46px; height: 46px; }
h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 76px; line-height: 1.02; color: #fff; margin: 54px 0 26px; }
.lede { font-size: 25px; line-height: 1.4; color: #d6dce6; margin: 0; }
.foot { position: absolute; left: 72px; bottom: 56px; font-size: 19px; color: #aab4c4; }
.foot b { color: #ffcf86; font-weight: 600; }
svg { position: absolute; right: -70px; top: 50%; transform: translateY(-50%); width: 560px; height: 560px; }
</style>
</head>
<body>
<div class="text">
  <div class="brand"><img src="logo.svg" alt="">State of the Prompt</div>
  <h1>A year of what people ask AI</h1>
  <p class="lede">73,852 people in the United States shared a year of their ChatGPT conversations with researchers.</p>
</div>
<p class="foot"><b>stateoftheprompt.net</b> &nbsp;·&nbsp; Rutgers University</p>
<svg id="dial" viewBox="8 8 384 384" aria-hidden="true"></svg>
<script>
(function () {
  'use strict';
  // the home page's hero dial, without the hour readout in the middle
  const NS = 'http://www.w3.org/2000/svg';
  const COLOR = { 'Health and body': '#2B9B81', 'Work, money and tech': '#FE9B00', 'School and learning': '#92C051',
    'Images, games and media': '#F4C40F', 'Relationships and inner life': '#E87B89', 'Home and daily life': '#D8443C',
    'Politics and law': '#AA7AA1', 'Other or unclear': '#676767' };
  // file:// pages cannot use fetch, so the data is read with XMLHttpRequest
  const get = f => new Promise((ok, no) => { const x = new XMLHttpRequest(); x.open('GET', '../data/' + f); x.onload = () => ok(JSON.parse(x.responseText)); x.onerror = no; x.send(); });
  Promise.all([get('site.json'), get('hours.json')]).then(([site, hrs]) => {
    const svg = document.getElementById('dial'), cx = 200, cy = 200, r0 = 80, span = 108;
    const H = hrs.hours, fams = site.families.map(f => ({ name: f.name, codes: [].concat(f.codes) }));
    const maxV = Math.max(...H.map(r => r.share));
    const pt = (r, a) => (cx + r * Math.sin(a)).toFixed(2) + ',' + (cy - r * Math.cos(a)).toFixed(2);
    const arc = (ri, ro, a0, a1) => 'M' + pt(ro, a0) + 'A' + ro + ',' + ro + ' 0 0 1 ' + pt(ro, a1) + 'L' + pt(ri, a1) + 'A' + ri + ',' + ri + ' 0 0 0 ' + pt(ri, a0) + 'Z';
    const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
    mk('circle', { cx, cy, r: r0 - 6, fill: 'none', stroke: 'rgba(255,255,255,0.12)' });
    H.forEach(r => {
      const a0 = (r.h * 15 + 0.9) * Math.PI / 180, a1 = ((r.h + 1) * 15 - 0.9) * Math.PI / 180, len = span * r.share / maxV;
      const tot = Object.values(r.s).reduce((a, b) => a + b, 0);
      let rr = r0;
      fams.forEach(f => { const d = len * f.codes.reduce((t, k) => t + r.s[k], 0) / tot; mk('path', { d: arc(rr, rr + d, a0, a1), fill: COLOR[f.name] }); rr += d; });
    });
    document.body.dataset.ready = '1';
  });
})();
</script>
</body>
</html>
